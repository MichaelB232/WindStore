<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>FinWise – Simulasi Cicilan</title>
    <style>
        :root {
            --bg: #eef1f0;
            --card: #ffffff;
            --ink: #132420;
            --muted: #5b6d68;
            --line: #dde3e1;
            --brand: #0f6e62;
            --brand-ink: #ffffff;
            --safe: #1a7a4c;
            --safe-bg: #e4f5ec;
            --warn: #9a6a08;
            --warn-bg: #fdf1dc;
            --danger: #a4312a;
            --danger-bg: #fbe6e4;
            --chip: #eef4f2;
        }

        * {
            box-sizing: border-box
        }

        body {
            margin: 0;
            background: var(--bg);
            font-family: ui-sans-serif, -apple-system, Segoe UI, Roboto, sans-serif;
            color: var(--ink);
            display: flex;
            justify-content: center;
            padding: 20px 10px
        }

        .phone {
            width: 100%;
            max-width: 410px;
            background: var(--card);
            border-radius: 28px;
            box-shadow: 0 20px 60px rgba(10, 30, 25, .18);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            min-height: 90vh
        }

        .top {
            background: var(--brand);
            color: var(--brand-ink);
            padding: 20px 18px 16px
        }

        .top h1 {
            margin: 0;
            font-size: 19px;
            font-weight: 650;
            letter-spacing: .2px
        }

        .top p {
            margin: 4px 0 0;
            font-size: 12.5px;
            opacity: .85
        }

        .screen {
            flex: 1;
            padding: 16px;
            overflow-y: auto
        }

        .hide {
            display: none
        }

        label {
            display: block;
            font-size: 12.5px;
            color: var(--muted);
            margin: 14px 0 5px
        }

        input,
        select {
            width: 100%;
            padding: 11px 12px;
            border: 1px solid var(--line);
            border-radius: 11px;
            font-size: 15px;
            background: #fcfdfd;
            color: var(--ink)
        }

        input:focus,
        select:focus {
            outline: 2px solid var(--brand);
            outline-offset: 1px
        }

        .pills {
            display: flex;
            gap: 7px;
            margin-top: 6px
        }

        .pill {
            flex: 1;
            padding: 9px 4px;
            border: 1px solid var(--line);
            border-radius: 10px;
            background: #fcfdfd;
            font-size: 12px;
            text-align: center;
            cursor: pointer;
            color: var(--muted)
        }

        .pill.active {
            background: var(--brand);
            color: #fff;
            border-color: var(--brand)
        }

        button.primary {
            width: 100%;
            margin-top: 18px;
            padding: 13px;
            border: none;
            border-radius: 12px;
            background: var(--brand);
            color: #fff;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer
        }

        button.ghost {
            width: 100%;
            margin-top: 9px;
            padding: 11px;
            border: 1px solid var(--line);
            border-radius: 12px;
            background: #fff;
            color: var(--ink);
            font-size: 13.5px;
            cursor: pointer
        }

        .card {
            background: #fff;
            border: 1px solid var(--line);
            border-radius: 14px;
            padding: 14px;
            margin-top: 14px
        }

        .row {
            display: flex;
            justify-content: space-between;
            font-size: 13.5px;
            padding: 4px 0;
            color: var(--muted)
        }

        .row b {
            color: var(--ink);
            font-weight: 600
        }

        .badge {
            display: inline-block;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 650;
            margin-bottom: 8px
        }

        .badge.safe {
            background: var(--safe-bg);
            color: var(--safe)
        }

        .badge.warn {
            background: var(--warn-bg);
            color: var(--warn)
        }

        .badge.danger {
            background: var(--danger-bg);
            color: var(--danger)
        }

        .tabbar {
            display: flex;
            border-top: 1px solid var(--line)
        }

        .tabbar button {
            flex: 1;
            padding: 13px 0;
            border: none;
            background: #fff;
            font-size: 12.5px;
            color: var(--muted);
            cursor: pointer
        }

        .tabbar button.on {
            color: var(--brand);
            font-weight: 650
        }

        .chips {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-top: 10px
        }

        .chip {
            padding: 7px 11px;
            border-radius: 16px;
            background: var(--chip);
            color: var(--brand);
            font-size: 12px;
            cursor: pointer;
            border: 1px solid transparent
        }

        .chatlog {
            margin-top: 12px;
            max-height: 260px;
            overflow-y: auto
        }

        .msg {
            padding: 9px 12px;
            border-radius: 12px;
            margin-bottom: 8px;
            font-size: 13.5px;
            line-height: 1.45
        }

        .msg.user {
            background: var(--chip);
            margin-left: 30px
        }

        .msg.ai {
            background: #f6f6f1;
            margin-right: 10px;
            border: 1px solid var(--line)
        }

        .msg.err {
            background: var(--danger-bg);
            color: var(--danger)
        }

        .suggest {
            display: inline-block;
            margin-top: 8px;
            padding: 7px 11px;
            border-radius: 10px;
            background: var(--brand);
            color: #fff;
            font-size: 12px;
            cursor: pointer
        }

        .inline {
            display: flex;
            gap: 6px;
            margin-top: 10px
        }

        .inline input {
            flex: 1
        }

        .inline button {
            padding: 0 16px;
            border: none;
            border-radius: 11px;
            background: var(--brand);
            color: #fff;
            font-size: 13px;
            cursor: pointer
        }

        .muted {
            color: var(--muted);
            font-size: 12px;
            margin-top: 6px
        }

        .twocol {
            display: flex;
            gap: 8px
        }

        .twocol>div {
            flex: 1
        }

        details {
            margin-top: 14px;
            border: 1px solid var(--line);
            border-radius: 12px;
            padding: 10px 12px
        }

        details summary {
            font-size: 13px;
            color: var(--muted);
            cursor: pointer
        }
    </style>
</head>

<body>
    <div class="phone">
        <div class="top">
            <h1>FinWise</h1>
            <p>Simulasi cicilan + insight AI sebelum kamu putuskan</p>
        </div>

        <div class="screen" id="screen-setup">
            <label>Total pemasukan bulanan</label>
            <input id="income" type="number" placeholder="Misal 8000000">
            <label>Fixed expenses (tagihan wajib rutin)</label>
            <input id="fixed" type="number" placeholder="Listrik, internet, cicilan lama...">
            <label>Cicilan / utang berjalan saat ini</label>
            <input id="existingDebt" type="number" placeholder="Total cicilan aktif per bulan">
            <label>Buffer kebutuhan hidup minimum</label>
            <input id="living" type="number" placeholder="Makan, transport, dll yang tak boleh diganggu">
            <label>Toleransi risiko DTI pribadi</label>
            <div class="pills" id="pills">
                <div class="pill" data-v="0.2">20%<br>Konservatif</div>
                <div class="pill" data-v="0.25">25%<br>Moderat</div>
                <div class="pill active" data-v="0.35">35%<br>Maks. OJK</div>
            </div>
            <button class="primary" onclick="goSimulate()">Simpan & buka simulasi</button>
            <div class="card" id="setupCard"></div>
        </div>

        <div class="screen hide" id="screen-sim">
            <div class="card" id="capacityCard"></div>

            <label>Cicilan baru yang dipertimbangkan</label>
            <input id="installment" type="number" placeholder="Misal 1200000" oninput="recalc()">
            <div class="twocol">
                <div><label>Jenis kredit</label>
                    <select id="assetType" onchange="applyPreset();recalc()">
                        <option value="none">Tanpa aset (umum)</option>
                        <option value="motor">Kendaraan motor</option>
                        <option value="mobil">Kendaraan mobil</option>
                        <option value="gadget">Gadget/elektronik</option>
                    </select>
                </div>
                <div><label>Tenor (bulan)</label>
                    <input id="tenor" type="number" placeholder="12" oninput="recalc()">
                </div>
            </div>
            <div class="twocol">
                <div><label>Pajak/asuransi tahunan</label>
                    <input id="annualTax" type="number" value="0" oninput="recalc()">
                </div>
                <div><label>Perawatan bulanan</label>
                    <input id="maint" type="number" value="0" oninput="recalc()">
                </div>
            </div>

            <div class="card" id="resultCard"></div>
            <div class="card" id="recoCard"></div>

            <div class="card">
                <b style="font-size:14px">Tanya AI dulu sebelum deal 🧠</b>
                <div class="muted">AI tahu kondisi cashflow-mu saat ini dan menjawab berdasarkan angka riil, bukan
                    tebakan.</div>
                <details>
                    <summary>Pengaturan Gemini API (sekali isi, tersimpan lokal)</summary>
                    <label>Gemini API key</label>
                    <input id="apiKey" type="password" placeholder="AIza...">
                    <label>Model</label>
                    <input id="apiModel" value="gemini-3.1-flash-lite">
                </details>
                <div class="chips" id="quickChips"></div>
                <div class="chatlog" id="chatlog"></div>
                <div class="inline">
                    <input id="chatInput" placeholder="Tulis pertanyaanmu...">
                    <button onclick="sendChat()">Kirim</button>
                </div>
            </div>
        </div>

        <div class="tabbar">
            <button id="tab-setup" class="on" onclick="showTab('setup')">🏠 Setup</button>
            <button id="tab-sim" onclick="showTab('sim')">🧮 Simulasi</button>
        </div>
    </div>

    <script>
        let state = { income: 0, fixed: 0, existingDebt: 0, living: 0, tolerance: 0.35 };
        try { const s = localStorage.getItem('finwise-state'); if (s) state = JSON.parse(s); } catch (e) { }
        const presets = {
            none: { tax: 0, maint: 0 },
            motor: { tax: 300000, maint: 150000 },
            mobil: { tax: 1800000, maint: 450000 },
            gadget: { tax: 0, maint: 50000 }
        };
        const quickQs = [
            "Apakah cicilan ini aman untuk kondisiku?",
            "Apa risiko terbesar kalau aku ambil ini?",
            "Kasih alternatif tenor yang lebih aman",
            "Apa yang harus aku korbankan bulan ini?"
        ];

        function fmt(n) { n = Math.round(n || 0); return 'Rp' + n.toLocaleString('id-ID'); }
        function save() { try { localStorage.setItem('finwise-state', JSON.stringify(state)); } catch (e) { } }

        function initSetup() {
            document.getElementById('income').value = state.income || '';
            document.getElementById('fixed').value = state.fixed || '';
            document.getElementById('existingDebt').value = state.existingDebt || '';
            document.getElementById('living').value = state.living || '';
            document.querySelectorAll('.pill').forEach(p => {
                p.classList.toggle('active', parseFloat(p.dataset.v) === state.tolerance);
                p.onclick = () => { document.querySelectorAll('.pill').forEach(x => x.classList.remove('active')); p.classList.add('active'); state.tolerance = parseFloat(p.dataset.v); };
            });
            quickQs.forEach(q => {
                const c = document.createElement('div'); c.className = 'chip'; c.textContent = q;
                c.onclick = () => { document.getElementById('chatInput').value = q; sendChat(); };
                document.getElementById('quickChips').appendChild(c);
            });
            try { const k = localStorage.getItem('finwise-key'); if (k) document.getElementById('apiKey').value = k; } catch (e) { }
        }

        function capacity() {
            const netCapacity = state.income - (state.fixed + state.existingDebt + state.living);
            const grossDtiLimit = state.income * state.tolerance;
            const maxSafe = Math.min(grossDtiLimit - state.existingDebt, netCapacity);
            return { netCapacity, grossDtiLimit, maxSafe };
        }

        function goSimulate() {
            state.income = +document.getElementById('income').value || 0;
            state.fixed = +document.getElementById('fixed').value || 0;
            state.existingDebt = +document.getElementById('existingDebt').value || 0;
            state.living = +document.getElementById('living').value || 0;
            save();
            const c = capacity();
            document.getElementById('setupCard').innerHTML =
                `<div class="row">Net capacity (cashflow bebas riil)<b>${fmt(c.netCapacity)}</b></div>
     <div class="row">Batas DTI (${state.tolerance * 100}%)<b>${fmt(c.grossDtiLimit)}</b></div>
     <div class="row">Max cicilan aman disarankan<b>${fmt(c.maxSafe)}</b></div>`;
            showTab('sim');
        }

        function applyPreset() {
            const p = presets[document.getElementById('assetType').value];
            document.getElementById('annualTax').value = p.tax;
            document.getElementById('maint').value = p.maint;
        }

        function recalc() {
            const c = capacity();
            document.getElementById('capacityCard').innerHTML =
                `<div class="row">Pemasukan<b>${fmt(state.income)}</b></div>
     <div class="row">Net capacity<b>${fmt(c.netCapacity)}</b></div>
     <div class="row">Max cicilan aman<b>${fmt(c.maxSafe)}</b></div>`;

            const installment = +document.getElementById('installment').value || 0;
            const tax = +document.getElementById('annualTax').value || 0;
            const maint = +document.getElementById('maint').value || 0;
            const tenor = +document.getElementById('tenor').value || 0;
            const effective = installment + tax / 12 + maint;

            let zone = 'safe', label = 'AMAN', note = 'Cicilan ini tidak mengganggu biaya hidup maupun batas toleransi risikomu.';
            if (effective > c.netCapacity) { zone = 'danger'; label = 'BAHAYA'; note = 'Cicilan ini akan membuat defisit kas riil atau menggerus kebutuhan pokok/dana darurat.'; }
            else if (effective > c.maxSafe) { zone = 'warn'; label = 'WASPADA'; note = 'Secara cashflow kamu mampu, tapi rasio utang sudah melewati toleransi risiko pribadimu.'; }

            document.getElementById('resultCard').innerHTML =
                `<span class="badge ${zone}">${label}</span>
     <div class="row">Cicilan dasar<b>${fmt(installment)}</b></div>
     <div class="row">+ Pajak/asuransi per bulan<b>${fmt(tax / 12)}</b></div>
     <div class="row">+ Perawatan per bulan<b>${fmt(maint)}</b></div>
     <div class="row">= Beban efektif bulanan<b>${fmt(effective)}</b></div>
     <div class="muted">${note}</div>`;

            let reco = '';
            if (zone !== 'safe' && c.maxSafe > 0 && tenor > 0 && installment > 0) {
                const newTenor = Math.ceil(tenor * (installment / c.maxSafe));
                const freeUp = effective - c.maxSafe;
                reco = `<b style="font-size:13.5px">Opsi trade-off</b>
      <div class="row">Perpanjang tenor ke sekitar<b>${newTenor} bln</b></div>
      <div class="row">Atau kurangi pos gaya hidup sebesar<b>${fmt(freeUp)}</b>/bln</div>`;
            }
            document.getElementById('recoCard').innerHTML = reco;
            return { c, installment, tax, maint, tenor, effective, zone, label };
        }

        function showTab(t) {
            document.getElementById('screen-setup').classList.toggle('hide', t !== 'setup');
            document.getElementById('screen-sim').classList.toggle('hide', t !== 'sim');
            document.getElementById('tab-setup').classList.toggle('on', t === 'setup');
            document.getElementById('tab-sim').classList.toggle('on', t === 'sim');
            if (t === 'sim') recalc();
        }

        function addMsg(role, text) {
            const d = document.createElement('div'); d.className = 'msg ' + role; d.innerHTML = text;
            document.getElementById('chatlog').appendChild(d);
            d.scrollIntoView({ block: 'nearest' });
        }

        async function sendChat() {
            const input = document.getElementById('chatInput');
            const question = input.value.trim();
            if (!question) return;
            input.value = '';
            addMsg('user', question);
            const apiKey = document.getElementById('apiKey').value.trim();
            const model = document.getElementById('apiModel').value.trim() || 'gemini-3.1-flash-lite';
            try { localStorage.setItem('finwise-key', apiKey); } catch (e) { }
            if (!apiKey) { addMsg('err', 'Isi dulu Gemini API key di pengaturan di atas.'); return; }

            const r = recalc();
            const ctx = {
                pemasukan_bulanan: state.income, fixed_expenses: state.fixed,
                cicilan_berjalan: state.existingDebt, buffer_hidup_minimum: state.living,
                toleransi_dti: state.tolerance, net_capacity: Math.round(r.c.netCapacity),
                max_cicilan_aman: Math.round(r.c.maxSafe), cicilan_baru_dipertimbangkan: r.installment,
                tenor_bulan: r.tenor, beban_efektif_bulanan: Math.round(r.effective), status_zona: r.label
            };
            const sys = `Kamu adalah asisten keuangan pribadi di app FinWise. Kamu TAHU kondisi keuangan user saat ini secara real lewat data berikut (anggap ini hasil tool-call ke data user, bukan asumsi): ${JSON.stringify(ctx)}.
Jawab singkat (maks 80 kata), empatik, jujur, bahasa Indonesia santai tapi jelas, berbasis angka di atas, bukan nasihat generik.
Jika relevan dan kamu punya rekomendasi angka cicilan/tenor baru yang lebih aman, akhiri jawabanmu dengan baris baru persis format:
SUGGESTION:{"installment":ANGKA,"tenor":ANGKA,"note":"alasan singkat"}
Jika tidak ada rekomendasi angka baru, jangan tulis baris SUGGESTION sama sekali.`;

            addMsg('ai', '<i>mengetik...</i>');
            const thinking = document.getElementById('chatlog').lastChild;
            try {
                const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent`, {
                    method: 'POST', headers: { 'Content-Type': 'application/json', 'x-goog-api-key': apiKey },
                    body: JSON.stringify({ system_instruction: { parts: [{ text: sys }] }, contents: [{ role: 'user', parts: [{ text: question }] }] })
                });
                const data = await res.json();
                thinking.remove();
                if (!res.ok) { addMsg('err', 'Gagal memanggil Gemini: ' + (data.error?.message || res.status)); return; }
                let text = data.candidates?.[0]?.content?.parts?.map(p => p.text).join('') || '(tidak ada respons)';
                const m = text.match(/SUGGESTION:(\{.*\})/s);
                let sugg = null;
                if (m) { text = text.replace(m[0], '').trim(); try { sugg = JSON.parse(m[1]); } catch (e) { } }
                addMsg('ai', text.replace(/\n/g, '<br>'));
                if (sugg && sugg.installment) {
                    const chip = document.createElement('div'); chip.className = 'suggest';
                    chip.textContent = `Gunakan saran: ${fmt(sugg.installment)}${sugg.tenor ? ' / ' + sugg.tenor + ' bln' : ''} →`;
                    chip.onclick = () => {
                        document.getElementById('installment').value = sugg.installment;
                        if (sugg.tenor) document.getElementById('tenor').value = sugg.tenor;
                        recalc();
                        document.getElementById('screen-sim').scrollTop = 0;
                    };
                    document.getElementById('chatlog').appendChild(chip);
                }
            } catch (e) {
                thinking.remove();
                addMsg('err', 'Request gagal. Kalau file ini dibuka di preview Claude, coba download & buka langsung di browser biasa, karena pemanggilan API eksternal bisa diblok di sandbox preview.');
            }
        }

        initSetup();
    </script>
</body>

</html>
